name: Port BAK fixes

# Пренася трите поправки от BAK, без да пипа добавките на TAXISOFIA
# (access.json, killswitch.txt, config.json и свързаният код в app.js).
#
# 1. checkEventAlerts: upcoming е const, а се преприсвоява → грешка при
#    DOMContentLoaded, която спира останалия init код.
# 2. Панелът за събития е закован видим от display:grid !important и стои
#    отворен с примерния шаблон (китарата и тиретата); ✕ не го затваря.
# 3. Лентата за времето е грид с автоматично подреждане и значката на КАТ
#    попада в разтегливата колона.

on:
  push:
    paths: ['.github/workflows/port-bak-fixes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.js
        run: |
          python3 - <<'PYEOF'
          s = open('app.js', encoding='utf-8').read()
          old, new = 'const upcoming=EVENTS.filter', 'let upcoming=EVENTS.filter'
          n = s.count(old)
          print('const upcoming occurrences:', n)
          assert n == 1, 'expected exactly one'
          open('app.js', 'w', encoding='utf-8').write(s.replace(old, new))
          print('app.js patched')
          PYEOF

      - name: Syntax check
        run: node --check app.js

      - name: Patch index.html
        run: |
          python3 - <<'PYEOF'
          h = open('index.html', encoding='utf-8').read()

          # празен шаблон вместо примерните стойности
          for old, new in [
            ('<div class="ea-icon" id="ea-icon">🎸</div>', '<div class="ea-icon" id="ea-icon"></div>'),
            ('<div class="ea-title" id="ea-title">—</div>', '<div class="ea-title" id="ea-title"></div>'),
            ('<div class="ea-sub"   id="ea-sub">—</div>', '<div class="ea-sub"   id="ea-sub"></div>'),
          ]:
              print('%-50s -> %d' % (old[:50], h.count(old)))
              h = h.replace(old, new)

          fix = """
          /* ═══ Пренесено от BAK: видимост на известието и подредба на лентата ═══ */

          #event-alert{ display:none !important; }
          #event-alert[style*="display:block"],
          #event-alert[style*="display: block"]{
            display:grid !important;
            grid-template-columns:auto auto 1fr auto;
            align-items:center; gap:8px;
          }
          #event-alert[data-dismissed="1"]{ display:none !important; }

          #weather-bar{
            display:flex !important;
            flex-wrap:nowrap !important;
            align-items:center !important;
            gap:10px !important;
            min-height:52px !important;
            max-height:64px !important;
          }
          #weather-bar .wb-icon{ display:none !important; }
          #weather-bar .wb-desc{ display:none !important; }
          #weather-bar .wb-temp,
          #kat-badge{ flex:0 0 auto !important; }
          #wx-rain-when{ flex:0 0 auto !important; margin-left:auto !important; }
          </style>"""

          idx = h.rfind('</style>')
          assert idx != -1, 'no closing style tag'
          h = h[:idx] + fix.replace('\n          ', '\n')[1:] + h[idx+len('</style>'):]

          # версията за кеша беше статична, затова браузърите държаха стария файл
          before = h
          h = h.replace('app.js?v=taxisofia', 'app.js?v=taxisofia-20260731')
          print('asset version bumped:', before != h)

          open('index.html', 'w', encoding='utf-8').write(h)
          PYEOF

      - name: Checks
        run: |
          echo "let upcoming:        $(grep -c 'let upcoming=EVENTS' app.js || true)"
          echo "guitar left:         $(grep -c 'ea-icon\">🎸' index.html || true)"
          echo "flex rule:           $(grep -c 'flex-wrap:nowrap' index.html || true)"
          python3 -c "
          s=open('index.html',encoding='utf-8').read()
          assert s.count('<style')==s.count('</style>'), 'style tags unbalanced'
          print('style tags balanced')
          "

      - name: Commit
        run: |
          git config user.name "ci"
          git config user.email "ci@emillion-lab"
          git add app.js index.html
          git commit -m "port three fixes from BAK: const reassignment, pinned alert panel, stretched KAT badge" || true
          git push || true
